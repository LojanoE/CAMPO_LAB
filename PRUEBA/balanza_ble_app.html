<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balanza Jontex - BLE Reader</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        button {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56,189,248,0.3); }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            margin-top: 0.5rem;
        }
        .weight-display {
            font-size: 4rem;
            font-weight: 800;
            text-align: center;
            color: var(--accent);
            margin: 1.5rem 0;
            font-variant-numeric: tabular-nums;
        }
        .unit { font-size: 1.5rem; color: #94a3b8; }
        .status {
            text-align: center;
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .status.connected { background: rgba(34,197,94,0.15); color: var(--success); }
        .status.disconnected { background: rgba(239,68,68,0.15); color: var(--danger); }
        .log {
            background: #0f172a;
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #94a3b8;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }
        .info-grid span { color: var(--text); font-weight: 600; }
        @media (max-width: 400px) {
            .weight-display { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <h1>⚖️ Balanza Jontex BLE</h1>
    <p class="subtitle">Conecta vía Bluetooth al indicador inalámbrico</p>

    <div class="card">
        <div id="status" class="status disconnected">🔴 Desconectado</div>
        <button id="btnConnect" class="btn-primary">🔗 Escanear y Conectar</button>
        <button id="btnDisconnect" class="btn-danger" style="display:none;">❌ Desconectar</button>
    </div>

    <div class="card">
        <div class="weight-display">
            <span id="weight">0.00</span><span class="unit"> kg</span>
        </div>
        <div class="info-grid">
            <div>Raw HEX: <span id="rawHex">-</span></div>
            <div>Raw ASCII: <span id="rawAscii">-</span></div>
            <div>Último RSSI: <span id="rssi">-</span></div>
            <div>Paquetes: <span id="packetCount">0</span></div>
        </div>
    </div>

    <div class="card">
        <strong style="font-size:0.85rem; color:#64748b;">📜 Log de datos</strong>
        <div id="log" class="log">Esperando conexión...</div>
    </div>

<script>
// UUIDs del módulo BR2262e (BLE-UART bridge)
const UART_SERVICE_UUID = 0xFF00;
const UART_RX_CHAR_UUID = 0xFF01; // Notify
const UART_TX_CHAR_UUID = 0xFF02; // Write

let device = null;
let server = null;
let rxCharacteristic = null;
let packetCount = 0;

const elStatus = document.getElementById('status');
const elWeight = document.getElementById('weight');
const elRawHex = document.getElementById('rawHex');
const elRawAscii = document.getElementById('rawAscii');
const elRssi = document.getElementById('rssi');
const elPacketCount = document.getElementById('packetCount');
const elLog = document.getElementById('log');
const btnConnect = document.getElementById('btnConnect');
const btnDisconnect = document.getElementById('btnDisconnect');

function log(msg) {
    const time = new Date().toLocaleTimeString('es-EC', {hour12:false});
    elLog.textContent += `\n[${time}] ${msg}`;
    elLog.scrollTop = elLog.scrollHeight;
}

function setStatus(connected) {
    if (connected) {
        elStatus.textContent = '🟢 Conectado';
        elStatus.className = 'status connected';
        btnConnect.style.display = 'none';
        btnDisconnect.style.display = 'block';
    } else {
        elStatus.textContent = '🔴 Desconectado';
        elStatus.className = 'status disconnected';
        btnConnect.style.display = 'block';
        btnDisconnect.style.display = 'none';
    }
}

function parseWeight(data) {
    // Intenta múltiples estrategias de parseo comunes en balanzas chinas
    const hex = Array.from(data).map(b => b.toString(16).padStart(2,'0')).join(' ');
    const ascii = new TextDecoder('ascii').decode(data).replace(/\x00/g, '·');

    elRawHex.textContent = hex;
    elRawAscii.textContent = ascii;

    // Estrategia 1: Buscar número en ASCII (ej: "  12.50" o "+001250")
    const match = ascii.match(/([+-]?\s*\d+[.,]?\d*)/);
    if (match) {
        const val = parseFloat(match[1].replace(',', '.').trim());
        if (!isNaN(val) && val >= 0 && val < 500) {
            elWeight.textContent = val.toFixed(2);
            return;
        }
    }

    // Estrategia 2: Si son 4-6 bytes, podría ser BCD o entero con decimales
    // (Placeholder para cuando sepamos el protocolo exacto)
}

async function connect() {
    try {
        log('Solicitando dispositivo BLE...');

        device = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: 'BR2262' },
                { services: [UART_SERVICE_UUID] }
            ],
            optionalServices: [UART_SERVICE_UUID]
        });

        log(`Dispositivo seleccionado: ${device.name}`);

        device.addEventListener('gattserverdisconnected', onDisconnected);

        server = await device.gatt.connect();
        log('GATT conectado.');

        const service = await server.getPrimaryService(UART_SERVICE_UUID);
        log('Servicio FF00 encontrado.');

        rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);
        log('Characteristic FF01 (RX) encontrada.');

        await rxCharacteristic.startNotifications();
        rxCharacteristic.addEventListener('characteristicvaluechanged', handleNotification);
        log('Notificaciones activadas. Esperando datos...');

        setStatus(true);

        // Leer RSSI si está disponible
        if (device.watchingAdvertisements) {
            elRssi.textContent = device.watchingAdvertisements ? 'Activo' : 'N/A';
        }

    } catch (err) {
        log(`Error: ${err.message}`);
        console.error(err);
    }
}

function handleNotification(event) {
    const value = event.target.value;
    const data = new Uint8Array(value.buffer);
    packetCount++;
    elPacketCount.textContent = packetCount;

    log(`Paquete #${packetCount}: ${data.length} bytes`);
    parseWeight(data);
}

function onDisconnected(event) {
    log('Dispositivo desconectado.');
    setStatus(false);
    device = null;
    server = null;
    rxCharacteristic = null;
}

async function disconnect() {
    if (device && device.gatt.connected) {
        await device.gatt.disconnect();
    }
    setStatus(false);
}

btnConnect.addEventListener('click', connect);
btnDisconnect.addEventListener('click', disconnect);

// Verificar soporte de Web Bluetooth
if (!navigator.bluetooth) {
    elStatus.textContent = '❌ Web Bluetooth no soportado. Usa Chrome/Edge en Android/Windows/Mac.';
    elStatus.className = 'status disconnected';
    btnConnect.disabled = true;
    log('ERROR: Navegador no compatible con Web Bluetooth API.');
}
</script>
</body>
</html>
